name: brain

on:
  schedule:
    # watchdog — every 10 min: if the chain's heartbeat is stale,
    # re-seed a chain link and bridge commands for ~45s.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "chain (24/7 link) · now (one pass + verdict) · sweep (watchdog pass)"
        required: false
        default: "chain"

jobs:
  chain:
    if: ${{ inputs.mode == 'chain' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    concurrency:
      group: brain-chain
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: serve link
        run: python brain.py
        env:
          BRAIN_MODE: "chain"
          BRAIN_CHAIN_SECONDS: "600"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
      - name: next link
        # a link that stood down or drained (CHAIN=0) stops the cascade;
        # the */10 cron sweep re-seeds when it's actually needed
        if: success() && env.CHAIN != '0'
        run: gh workflow run brain.yml --ref main -f mode=chain -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  sweep:
    if: ${{ github.event_name == 'schedule' || inputs.mode == 'sweep' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: brain-sweep
      cancel-in-progress: true
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python brain.py
        env:
          BRAIN_MODE: "sweep"
          BRAIN_SWEEP_SECONDS: "45"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GITHUB_TOKEN: ${{ github.token }}

  grind:
    if: ${{ inputs.mode != 'chain' && inputs.mode != 'sweep' && inputs.mode != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: brain-grind
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python brain.py
        env:
          BRAIN_MODE: ${{ inputs.mode }}
          BRAIN_MAX_MINUTES: "300"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}

  # crash / window deadline → the workflow re-runs once automatically
  retry-once:
    needs: grind
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 320
    concurrency:
      group: brain-grind
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python brain.py
        env:
          BRAIN_MODE: "now"
          BRAIN_MAX_MINUTES: "300"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
