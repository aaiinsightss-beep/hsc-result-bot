name: brain

on:
  schedule:
    # 04:55 UTC = 10:55 Asia/Dhaka (+06 fixed — no DST). The brain holds
    # itself inside the runner to the exact 10:59:55 second.
    - cron: "55 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "wake = scheduled sleep to 10:59:55 · now = poll one pass immediately"
        required: false
        default: "now"

permissions:
  contents: read

concurrency:
  group: brain
  cancel-in-progress: false

jobs:
  grind:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python brain.py
        env:
          BRAIN_MODE: ${{ inputs.mode || 'now' }}
          BRAIN_MAX_MINUTES: "300"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}

  # crash / deadline → the workflow re-runs once automatically
  retry-once:
    needs: grind
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python brain.py
        env:
          BRAIN_MODE: "now"
          BRAIN_MAX_MINUTES: "300"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
